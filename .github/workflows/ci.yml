name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make build test test-race

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config .golangci.yml --timeout 10m
      - name: Repository checks
        run: |
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          go vet ./...
          ./hack/check-boilerplate.sh
          ./hack/check-readonly.sh
          ./hack/check-deps.sh

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make vuln

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make docs

  integration:
    name: Scope integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make test-integration

  scale:
    name: Bounded-resource tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make test-scale

  container:
    name: Restricted container profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: make test-container

  e2e:
    name: Pinned operator journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: make test-e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: artifacts/e2e/

  release-artifacts:
    name: Release binaries and supply chain
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - run: make package test-multiarch supply-chain
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/
            artifacts/release/
