name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'
    tags:
      - 'v*'
  # A Dependabot bump that auto-merges lands on main as a push made with
  # GITHUB_TOKEN, and a push made with that token starts no workflow run.
  # The push trigger above therefore misses exactly the merges no human
  # watched. Branches need not be up to date with main to merge, so the
  # case this catches is two changes that pass apart and break together;
  # daily is the interval at which that is worth hearing about.
  # release-artifacts stays out of it: it is gated on event_name == push.
  schedule:
    - cron: '32 4 * * *'

permissions:
  contents: read

concurrency:
  # The event is part of the key because the daily schedule runs on the same
  # ref as a push to main. Without it, the two share a group and
  # cancel-in-progress lets the cron kill a push run mid-flight — including
  # the release-artifacts job that only push runs reach.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make build test test-race

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Read the pinned linter version
        id: linter
        run: |
          version=$(sed -n 's/^GOLANGCI_LINT_VERSION ?= //p' Makefile)
          test -n "$version" || { echo "no GOLANGCI_LINT_VERSION in Makefile" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.linter.outputs.version }}
          args: --config .golangci.yml --timeout 10m
      - name: Repository checks
        run: |
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
          go vet ./...
          ./hack/check-boilerplate.sh
          ./hack/check-readonly.sh
          ./hack/check-deps.sh
          ./hack/check-go-version.sh

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make vuln

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # No install: npm audit resolves the advisory set from the lockfile,
      # so this reads both trees without building either.
      - run: make audit

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make docs

  integration:
    name: Scope integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-integration

  scale:
    name: Bounded-resource tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-scale

  ui:
    name: Console UI in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hack/uitest/package-lock.json
      - run: make test-ui
        env:
          PGCONSOLE_UI_INSTALL_DEPS: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ui-results
          path: artifacts/ui/

  container:
    name: Restricted container profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - run: make test-container

  e2e:
    name: Pinned operator journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
      - run: make test-e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e-results
          path: artifacts/e2e/

  release-artifacts:
    name: Release binaries and supply chain
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - run: make package test-multiarch supply-chain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            dist/
            artifacts/release/
