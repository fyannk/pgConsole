name: Dependabot auto-merge

# Queues Dependabot's routine bumps for merge the moment the required
# checks on main go green. Nothing merges early: auto-merge only tells
# GitHub to merge once the branch ruleset is satisfied, so the same gates
# a human would wait for still apply. Majors are left alone — those want
# a person to read the changelog.

on:
  # pull_request_target, not pull_request: a workflow triggered by
  # Dependabot on pull_request gets a read-only token and could not
  # enable auto-merge. This job never checks out the pull request's
  # code, so the elevated token never meets anything the branch wrote.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Queue for merge on green
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      # Read-only. The merge runs on AUTOMERGE_TOKEN instead, so the
      # workflow's own token needs no more than reading the pull request
      # that dependabot/fetch-metadata inspects.
      contents: read
      pull-requests: read
    steps:
      - name: Read the update Dependabot proposes
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # AUTOMERGE_TOKEN, not GITHUB_TOKEN. A push made with GITHUB_TOKEN
      # starts no workflow run, so an auto-merged bump would land on main
      # with the pipeline never running against the merged result — the
      # release and supply-chain job included, which no pull request
      # reaches. Merging under a token that belongs to a person makes the
      # merge an ordinary push and CI behaves as it does for anyone else.
      - name: Queue patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          test -n "$GH_TOKEN" || {
            echo "::error::AUTOMERGE_TOKEN is unset. Auto-merge is off until" \
                 "it is set; see CONTRIBUTING.md. Merge this by hand." >&2
            exit 1
          }
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}

      - name: Say why a major was left alone
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "::notice::${{ steps.metadata.outputs.dependency-names }} is a major update; merge it by hand."
