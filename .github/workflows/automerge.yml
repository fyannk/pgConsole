name: Dependabot auto-merge

# Queues Dependabot's routine bumps for merge the moment the required
# checks on main go green. Nothing merges early: auto-merge only tells
# GitHub to merge once the branch ruleset is satisfied, so the same gates
# a human would wait for still apply. Majors are left alone — those want
# a person to read the changelog.

on:
  # pull_request, not pull_request_target. The earlier reasoning for the
  # latter — that a Dependabot pull_request run gets a read-only token and
  # could not enable auto-merge — stopped applying once the merge moved to
  # AUTOMERGE_TOKEN. What remains is that pull_request_target runs in the
  # base repository's context with its secrets available, and it is one
  # careless `actions/checkout` of the head ref away from running a
  # contributor's code with them. This workflow does not need that context,
  # so it does not ask for it.
  #
  # The cost: AUTOMERGE_TOKEN has to be a *Dependabot* secret, because a
  # Dependabot-triggered run sees only those. tool-pins.yml runs on a
  # schedule and needs the same token as an ordinary Actions secret.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Queue for merge on green
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      # Read-only. The merge runs on AUTOMERGE_TOKEN instead, so the
      # workflow's own token needs no more than reading the pull request
      # that dependabot/fetch-metadata inspects.
      contents: read
      pull-requests: read
    steps:
      - name: Read the update Dependabot proposes
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # AUTOMERGE_TOKEN, not GITHUB_TOKEN. A push made with GITHUB_TOKEN
      # starts no workflow run, so an auto-merged bump would land on main
      # with the pipeline never running against the merged result — the
      # release and supply-chain job included, which no pull request
      # reaches. Merging under a token that belongs to a person makes the
      # merge an ordinary push and CI behaves as it does for anyone else.
      # An allowlist rather than "not major": if update-type is ever empty or
      # carries a value this workflow has not seen, the gate closes instead
      # of arming a merge nobody chose. The negated form did the opposite.
      - name: Queue patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          test -n "$GH_TOKEN" || {
            echo "::error::AUTOMERGE_TOKEN is unset. It must be a Dependabot" \
                 "secret, not an Actions one: this workflow runs on" \
                 "pull_request, and a Dependabot-triggered run sees only" \
                 "Dependabot secrets. See CONTRIBUTING.md." >&2
            exit 1
          }
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}

      - name: Say why the bump was left alone
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor'
        run: |
          echo "::notice::${{ steps.metadata.outputs.dependency-names }} has update-type '${{ steps.metadata.outputs.update-type }}', which is outside the auto-merge allowlist. Merge it by hand."
