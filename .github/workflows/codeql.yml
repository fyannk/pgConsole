name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, so a newly disclosed pattern is caught even without a push.
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      # One language failing to analyse should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          # Go builds, so CodeQL needs the toolchain and a build to observe.
          - language: go
            name: Go
            build-mode: autobuild
          # The browser code is served as written, so there is nothing to
          # build and nothing for CodeQL to wait on.
          - language: javascript-typescript
            name: JavaScript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              # Vendored upstream libraries, shipped minified and not edited
              # here. Findings in them are upstream's to fix and would only
              # crowd out findings in the code this repo writes.
              - internal/web/static/*.min.js
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:${{ matrix.language }}"
