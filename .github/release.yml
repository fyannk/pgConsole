changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "🚨 Breaking changes"
      labels:
        - breaking
    - title: "✨ Features"
      labels:
        - enhancement
    - title: "🐛 Fixes"
      labels:
        - bug
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "🧰 Maintenance"
      labels:
        - "*"
