# Sample review object for the dba panel: one freshly created access
# request (no status = pending). Apply after the CRD is established.
# Namespace matches the example deployment's target cluster (payments).
#
# No roles are seeded: the approval picker offers the closed level set
# view/poweruser/dba from the console's own ladder, not objects.
apiVersion: pgtoolbox.fyannk.dev/v1alpha1
kind: PgToolBoxAccessRequest
metadata:
  name: alice-orders
  namespace: payments
spec:
  subject: alice
  message: Requesting read access to the orders console.
