# Additional Role for ALLOW_ACCESS_REVIEW=true, bound to the same
# ServiceAccount as the read-only Role. Apply this only when the dba
# access-request review panel is enabled; the default deployment never
# has it, so RBAC alone denies the one decision write regardless of the
# flag. In the pgToolBox deployment the operator adds these rules to the
# console's generated Role instead.
#
# The write surface is exactly one verb on one subresource: recording a
# reviewer's decision on a request status. The console reads requests to
# render the panel; it never creates or modifies users, proxy
# configuration, or the request spec.
#
# The approval picker needs no grant of its own. The levels it offers are
# the closed set view/poweruser/dba, hardcoded on both sides of the
# operator's contract, so there is no role kind to list.
#
# There is no create, delete, deletecollection, spec-write, or
# cluster-scoped grant, and nothing on secrets. The operator's controller
# materializes the PgToolBoxUser after an approval.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgconsole-orders-access-review
  namespace: payments
rules:
  # Read the pending and decided access requests to render the panel.
  - apiGroups: ["pgtoolbox.fyannk.dev"]
    resources: ["pgtoolboxaccessrequests"]
    verbs: ["get", "list", "watch"]
  # Record the reviewer's decision on the request status subresource. The
  # verb is patch, not update: the console writes the decision as a merge
  # patch, and RBAC names the HTTP verb rather than the intent. A Role
  # granting update alone refuses that write.
  - apiGroups: ["pgtoolbox.fyannk.dev"]
    resources: ["pgtoolboxaccessrequests/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgconsole-orders-access-review
  namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgconsole-orders-access-review
subjects:
  - kind: ServiceAccount
    name: pgconsole-orders
    namespace: payments
