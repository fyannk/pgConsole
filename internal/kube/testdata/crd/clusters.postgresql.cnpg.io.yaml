# Minimal CustomResourceDefinition of the CloudNativePG Cluster used by
# the integration environment. The schema accepts arbitrary content: the
# tests exercise access shape (pinned get, name-scoped watch, no list)
# and conversion, not CloudNativePG's own validation.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.postgresql.cnpg.io
spec:
  group: postgresql.cnpg.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
