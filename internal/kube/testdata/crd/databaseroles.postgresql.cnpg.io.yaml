# Minimal CustomResourceDefinition of the CloudNativePG DatabaseRole used by the
# integration environment. The schema accepts arbitrary content: the
# tests exercise access shape and application-side cluster selection,
# not CloudNativePG's own validation.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databaseroles.postgresql.cnpg.io
spec:
  group: postgresql.cnpg.io
  names:
    kind: DatabaseRole
    listKind: DatabaseRoleList
    plural: databaseroles
    singular: databaserole
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
