<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="pgConsole">
  <!-- Served from the binary rather than inlined as a data: URI, because
       the Content-Security-Policy sets img-src 'self' and favicons are
       governed by img-src. Without this file every page load spends a
       request on a 404 and logs a console error. -->
