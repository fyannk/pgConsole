version: "2"

# pgConsole's security properties are structural: mutations have one origin,
# external data is bounded and escaped, and sensitive failures are redacted at
# the client boundary. The linter set keeps those properties enforced.
run:
  timeout: 10m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errcheck
    - errorlint
    - godot
    - godox
    - gosec
    - govet
    - ineffassign
    - noctx
    - revive
    - staticcheck
    - unused

  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1003
        - -QF1008
    revive:
      enable-all-rules: false
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: unexported-return
        - name: var-declaration
    godox:
      keywords:
        - TODO
        - FIXME
        - HACK

  exclusions:
    rules:
      # Tests may use hostile fixtures and ignore write errors on purpose.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
